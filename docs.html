<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@construct-space/sdk — docs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --bg: #0c0d10;
      --panel: #14161b;
      --panel-2: #1a1d23;
      --panel-3: #1e2128;
      --border: #2a2e36;
      --border-2: #3a3f49;
      --text: #e6e8ec;
      --muted: #8b919d;
      --muted-2: #6a6f78;
      --accent: #7ab7ff;
      --accent-2: #c39bff;
      --accent-3: #8fe1b3;
      --warn: #ffb86b;
      --danger: #ff8e8e;
      --code: #eef0f4;
      --code-bg: #0f1115;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "SF Pro Text", system-ui, sans-serif; height: 100%; overflow: hidden; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 3px; font-size: 0.92em; color: var(--code); }
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px 18px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--code); margin: 14px 0; }
    pre code { background: transparent; padding: 0; font-size: inherit; }
    h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 8px 0; color: var(--text); }
    p.lead { color: var(--muted); font-size: 13px; }

    /* ── Header bar ───────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      font-size: 13px;
      z-index: 10;
    }
    .topbar .logo { color: var(--accent); font-family: var(--mono); font-weight: 600; }
    .topbar .ver { color: var(--accent-2); font-family: var(--mono); font-size: 12px; }
    .topbar .nav-pill { color: var(--muted); margin-left: auto; font-size: 12px; }
    .topbar .nav-pill a { color: var(--muted); margin-left: 14px; }
    .topbar .nav-pill a:hover { color: var(--text); }
    .topbar input.search {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      width: 240px;
      outline: none;
      transition: border-color .1s;
    }
    .topbar input.search:focus { border-color: var(--accent); }

    /* ── Layout ───────────────────────────────────────────── */
    .layout {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    aside.sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 16px 0;
      font-size: 13px;
    }
    aside.sidebar .group { margin-bottom: 8px; }
    aside.sidebar .group-title {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-2);
      padding: 12px 20px 6px;
      font-weight: 600;
    }
    aside.sidebar .group-subtitle {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted-2);
      padding: 8px 20px 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    aside.sidebar a.item {
      display: block;
      padding: 4px 20px 4px 28px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      border-left: 2px solid transparent;
      transition: background .08s, border-color .08s, color .08s;
      text-decoration: none;
    }
    aside.sidebar a.item:hover { background: var(--panel-2); color: var(--code); }
    aside.sidebar a.item.active {
      background: var(--panel-3);
      border-left-color: var(--accent);
      color: var(--accent);
    }
    aside.sidebar a.item .badge {
      display: inline-block;
      padding: 0 5px;
      border-radius: 3px;
      font-size: 9px;
      vertical-align: 2px;
      margin-left: 6px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: rgba(195, 155, 255, 0.15);
      color: var(--accent-2);
    }
    aside.sidebar a.item .badge.new {
      background: rgba(143, 225, 179, 0.15);
      color: var(--accent-3);
    }
    aside.sidebar a.item .badge.warn {
      background: rgba(255, 184, 107, 0.15);
      color: var(--warn);
    }

    /* ── Main content ─────────────────────────────────────── */
    main.content {
      flex: 1;
      overflow-y: auto;
      padding: 36px 48px 80px;
      max-width: 920px;
    }
    main.content h1.title {
      font-size: 26px;
      letter-spacing: -0.02em;
      font-family: var(--mono);
      color: var(--code);
    }
    main.content h1.title .ver { color: var(--accent-2); font-size: 13px; margin-left: 10px; }
    main.content h1.title .group {
      display: inline-block;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      vertical-align: 8px;
      margin-left: 12px;
    }
    main.content .summary {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      max-width: 780px;
    }
    main.content h2.sec {
      margin-top: 36px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    main.content h3.subsec {
      margin-top: 26px;
      font-size: 13px;
      color: var(--accent-3);
      font-family: var(--mono);
      letter-spacing: 0.02em;
    }
    main.content ul { color: var(--text); padding-left: 22px; }
    main.content ul li { margin: 4px 0; }
    main.content .callout {
      margin: 16px 0;
      padding: 12px 16px;
      background: rgba(122, 183, 255, 0.05);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      font-size: 13px;
    }
    main.content .callout.warn {
      background: rgba(255, 184, 107, 0.05);
      border-left-color: var(--warn);
    }
    main.content .callout b { color: var(--accent); }
    main.content .callout.warn b { color: var(--warn); }
    main.content .params {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }
    main.content .params th, main.content .params td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    main.content .params th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    main.content .params td code { font-size: 12.5px; }
    main.content .related { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    main.content .related a {
      display: inline-block;
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--code);
    }
    main.content .related a:hover { background: var(--panel-2); border-color: var(--border-2); text-decoration: none; }

    /* Home page */
    main.content.home .grid-home {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    main.content.home .grid-home .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: border-color .1s;
    }
    main.content.home .grid-home .card:hover { border-color: var(--border-2); }
    main.content.home .grid-home .card h3 {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    main.content.home .grid-home .card .n { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-bottom: 8px; }
    main.content.home .grid-home .card ul { padding-left: 0; margin: 0; list-style: none; }
    main.content.home .grid-home .card ul li a {
      display: block;
      padding: 3px 0;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--code);
    }
    main.content.home .grid-home .card ul li a:hover { color: var(--accent); text-decoration: none; }

    /* Code line accents — tiny manual highlighting */
    pre .kw { color: #c39bff; }
    pre .str { color: #8fe1b3; }
    pre .com { color: #6a6f78; font-style: italic; }
    pre .fn { color: #7ab7ff; }
    pre .num { color: #ffb86b; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="logo">@construct-space/sdk</span>
  <span class="ver">v0.11.0</span>
  <input type="text" class="search" id="search" placeholder="Filter sidebar… (⌘K)">
  <span class="nav-pill">
    <a href="map.html">map.html</a>
    <a href="final.map.html">final.map.html</a>
    <a href="https://github.com/construct-space" target="_blank">github</a>
  </span>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Docs data — every composable, store, component, subpackage entry.
// Schema:
//   { id, name, group, badge?, summary, signature, params?, returns?,
//     examples: [{title?, lang?, code}], notes?, related? }
// ═══════════════════════════════════════════════════════════════════════
const DOCS = {

// ────────────────────────────────── COMPOSABLES ─────────────────────────────
composables: {
  'Auth & Identity': [
    {
      id: 'useAuth',
      summary: 'Proxy to the Auth Pinia store. Reads current user + token; never mutates them.',
      signature: 'function useAuth(): ReturnType<typeof useAuthStore>',
      notes: [
        'Identical to <code>useAuthStore()</code>; the function form just preserves ergonomic parity with the other <code>use*</code> composables.',
        'Spaces SHOULD NOT call login flows. The host does that once and the result lands here.',
      ],
      examples: [
        { title: 'Read the current user',
          code: `<span class="kw">const</span> auth = <span class="fn">useAuth</span>()
<span class="kw">const</span> userName = <span class="fn">computed</span>(() => auth.user?.name ?? <span class="str">'Guest'</span>)` },
      ],
      related: ['useAuthorization', 'useAccess'],
    },
    {
      id: 'useAuthorization',
      summary: 'RBAC. "Can my role do X on Y?" One surface — core check plus CRUD sugar. Same argument order as useAccess: (action, resource).',
      signature: `function useAuthorization(): {
  // Core — reactive
  can(action: string, resource: string, resourceId?: string|number): Ref<boolean>
  canSync(action: string, resource: string): boolean
  canAny(checks: Array<{ action, resource }>): Ref<boolean>
  canAll(checks: Array<{ action, resource }>): Ref<boolean>

  // CRUD sugar — the four gates spaces actually render
  canView(resource: string): Ref<boolean>
  canCreate(resource: string): Ref<boolean>
  canEdit(resource: string): Ref<boolean>
  canDelete(resource: string): Ref<boolean>

  // Role inspection
  roles: Ref<Role[]>
  hasRole(role: string): Ref<boolean>
  hasPermission(name: string): Ref<boolean>
}`,
      notes: [
        'Answers "can a user with this role edit projects?" — not "can <i>this</i> user edit <i>this</i> project."',
        'For per-resource decisions (sharing, ownership), use <a href="#useAccess">useAccess</a>.',
        '<code>usePermissions</code> was folded into this surface in v0.11. The old <code>useCanReactive</code> / <code>usePermissionReactive</code> / <code>ui.canEdit</code> shapes are gone; everything below is reactive by default.',
      ],
      examples: [
        { title: 'Gate a CRUD button',
          code: `<span class="kw">const</span> { canEdit } = <span class="fn">useAuthorization</span>()
<span class="kw">const</span> editable = <span class="fn">canEdit</span>(<span class="str">'project'</span>)
<span class="com">// in template: &lt;Button v-if="editable"&gt;Edit&lt;/Button&gt;</span>` },
        { title: 'Custom action',
          code: `<span class="kw">const</span> { can } = <span class="fn">useAuthorization</span>()
<span class="kw">const</span> canPublish = <span class="fn">can</span>(<span class="str">'publish'</span>, <span class="str">'space'</span>)` },
      ],
      related: ['useAccess', 'useOrgRoles'],
    },
    {
      id: 'useAccess',
      badge: 'new',
      summary: 'ABAC. Per-resource sharing — who has access to <i>this</i> folder, this board, this row. Bound to the space\'s own ACL model via the <code>acl:</code> block on <code>defineModel()</code>.',
      signature: `function useAccess<T = unknown>(): {
  // ── Decisions ──
  can(action: string, resource: T): Ref<boolean>
  canSync(action: string, resource: T): boolean
  filter(action: string, items: T[]): Ref<T[]>
  decide(action: string, items: T[]): Ref<Map<string, boolean>>

  // ── Membership ──
  members(resource: T): Ref<AccessMember[]>
  isOrgWide(resource: T): Ref<boolean>     // members.length === 0
  isRestricted(resource: T): Ref<boolean>  // members.length > 0
  hasAccess(resource: T, userId: string): Ref<boolean>
  roleOf(resource: T, userId: string): Ref<string | null>
  hasRoleAtLeast(resource: T, role: string): Ref<boolean>

  // ── Mutations ──
  grant(resource: T, userId: string, role: string): Promise<void>
  revoke(resource: T, userId: string): Promise<void>
  setRole(resource: T, userId: string, role: string): Promise<void>
  openToOrg(resource: T): Promise<void>     // delete all member rows
  transferOwnership(resource: T, toUserId: string): Promise<void>
}

interface AccessMember {
  user_id: string
  role: string
  granted_at?: string
  granted_by?: string
}`,
      notes: [
        '<b>Convention:</b> empty member set = open to org. Adding the first member <i>restricts</i> the resource; clearing all members <i>opens</i> it again.',
        '<b>User-only principals.</b> Construct is a desktop app with no anonymous web surface — sharing is either with a specific user or org-wide (implicit). Teams/departments are an extension a space can add by extending its own ACL columns.',
        '<b>Each space owns its ACL table.</b> No global access table in the SDK. Drive\'s ACL is <code>FolderMember</code>, Board\'s is <code>BoardMember</code>, etc.',
        '<b>App-scope spaces don\'t need this.</b> One user, no sharing semantics.',
      ],
      sections: [
        {
          title: 'Binding on the model',
          body: `<p>Declare the ACL on the resource model so <code>useAccess&lt;T&gt;()</code> can find it automatically:</p>`,
          code: `<span class="com">// Drive — packages/space-drive/src/models/Folder.ts</span>
<span class="kw">import</span> { defineModel, field, access } <span class="kw">from</span> <span class="str">'@construct-space/graph'</span>

<span class="kw">export const</span> FolderMember = <span class="fn">defineModel</span>(<span class="str">'folder_member'</span>, {
  folder_id: field.<span class="fn">string</span>().<span class="fn">required</span>().<span class="fn">index</span>(),
  user_id:   field.<span class="fn">string</span>().<span class="fn">required</span>().<span class="fn">index</span>(),
  role:      field.<span class="fn">string</span>().<span class="fn">required</span>(),
}, { access: { read: access.<span class="fn">member</span>(), create: access.<span class="fn">member</span>(),
              update: access.<span class="fn">member</span>(), delete: access.<span class="fn">member</span>() } })

<span class="kw">export const</span> Folder = <span class="fn">defineModel</span>(<span class="str">'folder'</span>, {
  name:     field.<span class="fn">string</span>().<span class="fn">required</span>(),
  owner_id: field.<span class="fn">string</span>().<span class="fn">required</span>(),
}, {
  access: {                                <span class="com">// RBAC (class-level CRUD)</span>
    read:   access.<span class="fn">member</span>(),
    create: access.<span class="fn">authenticated</span>(),
    update: access.<span class="fn">member</span>(),
    delete: access.<span class="fn">owner</span>(),
  },
  acl: {                                   <span class="com">// ABAC (per-resource sharing)</span>
    model: FolderMember,
    resourceKey: <span class="str">'folder_id'</span>,
    roles: [<span class="str">'viewer'</span>, <span class="str">'commenter'</span>, <span class="str">'editor'</span>, <span class="str">'owner'</span>],
    rules: {
      share: (actor, f) => actor.<span class="fn">hasRoleAtLeast</span>(f, <span class="str">'owner'</span>),
    },
  },
  scopes: [<span class="str">'org'</span>],
})`,
        },
        {
          title: 'Drive share dialog — full flow',
          body: `<p>Two composables, zero glue. <code>useOrgMembers()</code> for the picker, <code>useAccess</code> for the actual grants.</p>`,
          code: `<span class="com">&lt;script setup lang="ts"&gt;</span>
<span class="kw">const</span> folder = props.folder
<span class="kw">const</span> access = <span class="fn">useAccess</span>&lt;Folder&gt;()
<span class="kw">const</span> { members: orgPeople } = <span class="fn">useOrgMembers</span>()

<span class="kw">const</span> isOpen = access.<span class="fn">isOrgWide</span>(folder)
<span class="kw">const</span> currentACL = access.<span class="fn">members</span>(folder)
<span class="kw">const</span> canShare = access.<span class="fn">can</span>(<span class="str">'share'</span>, folder)

<span class="kw">async function</span> shareWith(m) {
  <span class="kw">await</span> access.<span class="fn">grant</span>(folder, m.id, <span class="str">'viewer'</span>)
}
<span class="kw">async function</span> removeAccess(uid) {
  <span class="kw">await</span> access.<span class="fn">revoke</span>(folder, uid)
}
<span class="com">&lt;/script&gt;</span>

<span class="com">&lt;template&gt;</span>
  <span class="com">&lt;Modal v-if="canShare"&gt;</span>
    <span class="com">&lt;h3&gt;Share "{{ folder.name }}"&lt;/h3&gt;</span>

    <span class="com">&lt;p v-if="isOpen"&gt;Open to everyone in your organization.&lt;/p&gt;</span>
    <span class="com">&lt;ul v-else&gt;</span>
      <span class="com">&lt;li v-for="m in currentACL" :key="m.user_id"&gt;</span>
        <span class="com">{{ m.user_id }} — {{ m.role }}</span>
        <span class="com">&lt;Button @click="removeAccess(m.user_id)"&gt;Remove&lt;/Button&gt;</span>
      <span class="com">&lt;/li&gt;</span>
    <span class="com">&lt;/ul&gt;</span>

    <span class="com">&lt;SelectMenu :options="orgPeople" @select="shareWith" /&gt;</span>
    <span class="com">&lt;Button @click="access.openToOrg(folder)"&gt;Make org-wide&lt;/Button&gt;</span>
  <span class="com">&lt;/Modal&gt;</span>
<span class="com">&lt;/template&gt;</span>`,
        },
        {
          title: 'Listing a user\'s accessible folders',
          body: `<p>Use <code>filter</code> for bulk per-row decisions on a list — much cheaper than calling <code>can()</code> in a loop.</p>`,
          code: `<span class="kw">const</span> { records: folders } = <span class="fn">useData</span>(Folder)
<span class="kw">const</span> access = <span class="fn">useAccess</span>&lt;Folder&gt;()

<span class="kw">const</span> visible = access.<span class="fn">filter</span>(<span class="str">'view'</span>, folders.value)
<span class="kw">const</span> editable = access.<span class="fn">filter</span>(<span class="str">'edit'</span>, folders.value)`,
        },
        {
          title: 'Role ladder + hasRoleAtLeast',
          body: `<p>The <code>roles</code> array on <code>acl:</code> defines the ordering. <code>hasRoleAtLeast</code> compares positionally — <code>'editor'</code> includes everyone at <code>'editor'</code> or above.</p>`,
          code: `<span class="com">// acl.roles: ['viewer', 'commenter', 'editor', 'owner']</span>

access.<span class="fn">hasRoleAtLeast</span>(folder, <span class="str">'editor'</span>)
<span class="com">// → true for users granted 'editor' OR 'owner'</span>

<span class="com">// Use inside ACL rules:</span>
rules: {
  share: (actor, f) => actor.<span class="fn">hasRoleAtLeast</span>(f, <span class="str">'owner'</span>),
  comment: (actor, f) => actor.<span class="fn">hasRoleAtLeast</span>(f, <span class="str">'commenter'</span>),
}`,
        },
        {
          title: 'Org-wide vs restricted',
          body: `<p>Empty ACL = org-wide. The host's ACL middleware enforces this — any org member can read/edit per the model's <code>access:</code> block. Grant the first row to flip the resource into "restricted" mode.</p>`,
          code: `access.<span class="fn">isOrgWide</span>(folder)      <span class="com">// true ↔ members.length === 0</span>
access.<span class="fn">isRestricted</span>(folder)    <span class="com">// true ↔ members.length > 0</span>

<span class="com">// Flip back to org-wide:</span>
<span class="kw">await</span> access.<span class="fn">openToOrg</span>(folder)
<span class="com">// → deletes every row in FolderMember where folder_id = folder.id</span>`,
        },
      ],
      related: ['useAuthorization', 'useOrgMembers', 'useData'],
    },
  ],

  'Organization': [
    { id: 'useOrg', summary: 'Active organization. Identity + counts (members, teams, departments).', signature: 'function useOrg(): { current, isEnabled, memberCount, ... }', related: ['useOrgMembers'] },
    { id: 'useOrgMembers', summary: 'Member roster. List, invite, update role, remove.', signature: `function useOrgMembers(): {
  members: Ref<OrgMember[]>
  invite(email, role?): Promise<void>
  remove(id): Promise<void>
  update(id, patch): Promise<void>
}`,
      examples: [{ title: 'Picker fed into a share dialog',
        code: `<span class="kw">const</span> { members } = <span class="fn">useOrgMembers</span>()
<span class="kw">const</span> access = <span class="fn">useAccess</span>&lt;Folder&gt;()
<span class="com">// template:</span>
<span class="com">// &lt;SelectMenu :options="members" @select="(m) =&gt; access.grant(folder, m.id, 'viewer')" /&gt;</span>` }],
      related: ['useAccess', 'useOrgTeams'] },

// ── Build sidebar ──
function buildSidebar() {
  const root = document.getElementById('sidebar')
  let html = ''

  // Composables
  html += `<div class="group"><div class="group-title">Composables</div>`
  for (const [groupName, items] of Object.entries(DOCS.composables)) {
    html += `<div class="group-subtitle">${groupName} <span style="color:var(--muted-2)">${items.length}</span></div>`
    for (const item of items) {
      const badgeClass = item.badge === 'warn' ? 'warn' : item.badge === 'new' ? 'new' : ''
      const badge = item.badge
        ? `<span class="badge ${badgeClass}">${item.badge}</span>`
        : ''
      html += `<a class="item" href="#${item.id}" data-id="${item.id}">${item.name || item.id}${badge}</a>`
    }
  }
  html += `</div>`

  // Stores
  html += `<div class="group"><div class="group-title">Stores</div>`
  for (const s of DOCS.stores) {
    html += `<a class="item" href="#${s.id}" data-id="${s.id}">${s.id}</a>`
  }
  html += `</div>`

  // Components (just group titles + names)
  html += `<div class="group"><div class="group-title">Components</div>`
  for (const grp of DOCS.components) {
    html += `<div class="group-subtitle">${grp.group}</div>`
    for (const name of grp.items) {
      html += `<a class="item" href="#component:${name}" data-id="component:${name}">${name}</a>`
    }
  }
  html += `</div>`

  // Subpackages
  html += `<div class="group"><div class="group-title">Subpackages</div>`
  for (const p of DOCS.subpackages) {
    html += `<a class="item" href="#${p.id.replace('/', ':')}" data-id="${p.id.replace('/', ':')}">${p.id}</a>`
  }
  html += `</div>`

  root.innerHTML = html
}

// ── Resolve hash → entry ──
function findEntry(id) {
  for (const items of Object.values(DOCS.composables)) {
    for (const it of items) if (it.id === id) return { kind: 'composable', entry: it, group: groupOf(it.id) }
  }
  for (const s of DOCS.stores) if (s.id === id) return { kind: 'store', entry: s }
  if (id.startsWith('component:')) {
    const name = id.slice('component:'.length)
    return { kind: 'component', entry: { id, name } }
  }
  for (const p of DOCS.subpackages) {
    if (p.id.replace('/', ':') === id) return { kind: 'subpackage', entry: p }
  }
  return null
}
function groupOf(id) {
  for (const [groupName, items] of Object.entries(DOCS.composables)) {
    for (const it of items) if (it.id === id) return groupName
  }
  return ''
}

// ── Render main pane ──
function render() {
  const main = document.getElementById('content')
  const hash = location.hash.replace(/^#/, '')
  // Highlight active sidebar item
  document.querySelectorAll('aside.sidebar a.item').forEach(a => {
    a.classList.toggle('active', a.dataset.id === hash)
  })

  if (!hash) return renderHome(main)
  const found = findEntry(hash)
  if (!found) return renderHome(main, hash)

  main.classList.remove('home')
  if (found.kind === 'composable')   return renderComposable(main, found.entry, found.group)
  if (found.kind === 'store')        return renderStore(main, found.entry)
  if (found.kind === 'component')    return renderComponent(main, found.entry)
  if (found.kind === 'subpackage')   return renderSubpackage(main, found.entry)
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

function renderHome(main, badHash) {
  main.classList.add('home')
  let html = `
    <h1 class="title">@construct-space/sdk <span class="ver">v0.11.0</span></h1>
    <p class="summary">TypeScript types and composables for building Construct Spaces. Pick anything in the sidebar to see its docs. <code>#useAccess</code> is the freshest landing — that's the ABAC composable Drive uses for the share flow.</p>
    ${badHash ? `<div class="callout warn"><b>Not found:</b> <code>${escapeHtml(badHash)}</code>. Pick something from the sidebar.</div>` : ''}
    <h2 class="sec">By group</h2>
    <div class="grid-home">`

  for (const [groupName, items] of Object.entries(DOCS.composables)) {
    html += `<div class="card"><h3>${groupName}</h3><div class="n">${items.length} composables</div><ul>`
    for (const it of items.slice(0, 8)) {
      html += `<li><a href="#${it.id}">${it.id}</a></li>`
    }
    if (items.length > 8) html += `<li><a href="#${items[0].id}" style="color:var(--muted-2)">+${items.length - 8} more…</a></li>`
    html += `</ul></div>`
  }
  html += `</div>`
  main.innerHTML = html
}

function renderComposable(main, e, group) {
  const sig = e.signature
    ? `<h2 class="sec">Signature</h2><pre><code>${escapeHtml(e.signature)}</code></pre>`
    : ''

  const notes = e.notes && e.notes.length
    ? `<h2 class="sec">Notes</h2><ul>${e.notes.map(n => `<li>${n}</li>`).join('')}</ul>`
    : ''

  const examples = e.examples && e.examples.length
    ? `<h2 class="sec">Examples</h2>` +
      e.examples.map(ex => `<h3 class="subsec">${ex.title || 'Example'}</h3><pre><code>${ex.code}</code></pre>`).join('')
    : ''

  const sections = e.sections && e.sections.length
    ? e.sections.map(s => `<h2 class="sec">${s.title}</h2>${s.body || ''}${s.code ? `<pre><code>${s.code}</code></pre>` : ''}`).join('')
    : ''

  const related = e.related && e.related.length
    ? `<h2 class="sec">Related</h2><div class="related">${e.related.map(r => `<a href="#${r}">${r}</a>`).join('')}</div>`
    : ''

  main.innerHTML = `
    <h1 class="title">${e.id}<span class="group">${group}</span></h1>
    <p class="summary">${e.summary}</p>
    ${sig}
    ${notes}
    ${sections}
    ${examples}
    ${related}
  `
}

function renderStore(main, e) {
  main.innerHTML = `
    <h1 class="title">${e.id}<span class="group">Pinia store</span></h1>
    <p class="summary">${e.summary}</p>
    <h2 class="sec">Signature</h2>
    <pre><code>${escapeHtml(e.signature)}</code></pre>
    <div class="callout"><b>Convention:</b> read state from stores directly. Never infer state by catching API errors. See <a href="#sdk:data">sdk/data</a> for typed model CRUD.</div>
  `
}

function renderComponent(main, e) {
  main.innerHTML = `
    <h1 class="title">${e.name}<span class="group">UI primitive</span></h1>
    <p class="summary">Vue component declaration — host app supplies the runtime. Import from <code>@construct-space/sdk</code> and use directly in a Space's templates.</p>
    <h2 class="sec">Usage</h2>
    <pre><code><span class="kw">import</span> { ${e.name} } <span class="kw">from</span> <span class="str">'@construct-space/sdk'</span>

<span class="com">// template:</span>
<span class="com">&lt;${e.name} ... /&gt;</span></code></pre>
    <div class="callout">Component prop/emit shapes are typed via <code>DefineComponent</code> declarations. Your IDE will surface the full surface when you import and use it.</div>
  `
}

function renderSubpackage(main, e) {
  main.innerHTML = `
    <h1 class="title">${e.id}<span class="group">subpackage</span></h1>
    <p class="summary">${e.summary}</p>
    <h2 class="sec">Exports</h2>
    <div class="related">${e.exports.map(x => `<a href="#" onclick="event.preventDefault()" style="cursor:default">${x}</a>`).join('')}</div>
    <h2 class="sec">Import</h2>
    <pre><code><span class="kw">import</span> { ${e.exports.slice(0,3).join(', ')} } <span class="kw">from</span> <span class="str">'@construct-space/${e.id.split('/').pop()}'</span></code></pre>
  `
}

// ── Search filter ──
const searchInput = document.getElementById('search')
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim()
  document.querySelectorAll('aside.sidebar a.item').forEach(a => {
    const id = a.dataset.id.toLowerCase()
    a.style.display = !q || id.includes(q) ? '' : 'none'
  })
  document.querySelectorAll('aside.sidebar .group-subtitle, aside.sidebar .group-title').forEach(el => {
    el.style.display = q ? 'none' : ''
  })
})
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); searchInput.select() }
})

// ── Wire up ──
buildSidebar()
render()
window.addEventListener('hashchange', render)
</script>
